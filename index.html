<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Tur Rumah · Rencana Renovasi</title>
  <meta name="description" content="Tur interaktif rencana renovasi rumah: jalan dari gerbang, buka pintu, nyalakan lampu, ukur, dan bandingkan dengan rumah sebelum renovasi.">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="/poster/hero-1920.webp" imagesrcset="/poster/hero-960.webp 960w, /poster/hero-1920.webp 1920w" imagesizes="100vw" fetchpriority="high">
</head>
<body>
  <!-- Poster first (Shapespark pattern): the render paints before any 3D code loads. -->
  <main id="poster" class="poster">
    <img class="poster-img" src="/poster/hero-1920.webp" srcset="/poster/hero-960.webp 960w, /poster/hero-1920.webp 1920w"
         sizes="100vw" width="1920" height="1080" alt="Tampak depan rumah setelah renovasi: pagar, gerbang geser hitam, teras kayu dan atap genteng abu" fetchpriority="high">
    <p class="chip poster-note">Rencana renovasi · visualisasi · ukuran rencana</p>
    <section class="panel poster-card" aria-labelledby="poster-title">
      <h1 id="poster-title">Masuk ke rumah, setelah renovasi.</h1>
      <p class="poster-lead">Mulai dari depan gerbang. Buka pintu, nyalakan lampu, geser jam, ukur sendiri, dan bandingkan dengan rumah sebelum renovasi.</p>
      <button id="enter" class="btn-primary" type="button" disabled>Masuk</button>
      <p id="poster-status" class="poster-status" role="status" aria-live="polite"></p>
      <div class="poster-meta">
        <span class="desk-only"><kbd>W A S D</kbd> jalan · mouse melihat · <kbd>E</kbd> aksi</span>
        <span class="touch-only">Joystick untuk jalan · geser layar untuk melihat</span>
      </div>
      <noscript><p class="poster-status">Tur 3D butuh JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p></noscript>
    </section>
  </main>
  <div id="app"></div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
